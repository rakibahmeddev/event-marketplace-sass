<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="data.js"></script></helmet>
<nav style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 48px;background:#1A1A2E;font-family:Inter,sans-serif;position:sticky;top:0;z-index:50">
  <span style="font:700 13px 'Plus Jakarta Sans',sans-serif;color:#fff;margin-right:12px">brandname<span style="color:#FF6B4A">.</span> UI kit</span>
  <sc-for list="{{ pages }}" as="p" hint-placeholder-count="11">
    <sc-if value="{{ p.on }}"><a href="{{ p.href }}" style="height:30px;padding:0 12px;border-radius:999px;background:#5B2EE0;color:#fff;font:600 12px Inter;display:flex;align-items:center;gap:6px;text-decoration:none"><span style="opacity:.7">{{ p.n }}</span>{{ p.label }}</a></sc-if>
    <sc-if value="{{ p.off }}"><a href="{{ p.href }}" style="height:30px;padding:0 12px;border-radius:999px;background:#26263D;color:#C9C9D6;font:500 12px Inter;display:flex;align-items:center;gap:6px;text-decoration:none" style-hover="color:#fff"><span style="opacity:.6">{{ p.n }}</span>{{ p.label }}</a></sc-if>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:60},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.TIX) this._t = setInterval(() => { if (window.TIX) { clearInterval(this._t); this.forceUpdate(); } }, 40); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const P = (window.TIX && window.TIX.pages) || [];
    const cur = this.props.current || '';
    return { pages: P.map(([n, label, f]) => ({ n, label, href: encodeURI(f), on: n === cur, off: n !== cur })) };
  }
}
</script>
</body>
</html>
